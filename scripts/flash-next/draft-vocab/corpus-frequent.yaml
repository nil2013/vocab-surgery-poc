# Swap rows of TensorFold's built-in Flash-Next draft list for the tokens the user's corpus generates most.
# Any language: the corpus decides. The number of scored rows stays the base list's.
base: builtin                  # or a path to a list of upstream token ids
corpus:
  - path: outputs/test-data-fn # replay cases of Flash-Next's own opencode history
    parts: [text, reasoning, tool-arguments]
select:
  minCount: 2                  # a token generated at least this often may enter, most frequent first
replace:
  from: unused                 # base rows the corpus never generates
  order: highest-id            # BPE merges them last
protect:
  addedTokens: true            # <|im_end|>, <tool_call>, </think> and the other added tokens never leave
  tokens: []
force:
  add: []                      # token strings or ids that always enter
  remove: []                   # token strings or ids that always leave
